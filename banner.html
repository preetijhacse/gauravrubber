<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Premium Hero Banner</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.carousel.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/assets/owl.theme.default.min.css">

<style>
body{margin:0;font-family:Arial;background:#111;color:#fff}

/* HERO */
.hero-section{position:relative;overflow:hidden}
.hero-slider .item{height:700px;position:relative}

/* Background Zoom */
.hero-bg{
position:absolute;width:100%;height:100%;
background-size:cover;background-position:center;
animation:zoomBg 15s linear infinite;
z-index:1;
}
@keyframes zoomBg{
0%{transform:scale(1)}
100%{transform:scale(1.2)}
}

/* Overlay strips */
.overlay span{
position:absolute;width:25%;height:100%;
background:#fff;top:0;transform:scaleX(1);
transition:1.2s;z-index:2;
}
.overlay span:nth-child(1){left:0}
.overlay span:nth-child(2){left:25%}
.overlay span:nth-child(3){left:50%}
.overlay span:nth-child(4){left:75%}
.owl-item.active .overlay span{transform:scaleX(0)}

/* Content */
.hero-content{
position:absolute;
top:50%;
left:10%;
transform:translateY(-50%);
z-index:10;
}

/* Title */
.hero-title{
font-size:65px;
margin:0;
color:#fff;
}

/* Letter animation */
.hero-title span{
display:inline-block;
opacity:0;
transform:translateY(40px);
filter:blur(5px);
transition:.5s;
}
.owl-item.active .hero-title span{
opacity:1;
transform:translateY(0);
filter:blur(0);
}

/* Text */
.hero-text{
opacity:0;
transform:translateY(40px);
transition:1s;
margin:20px 0;
}
.owl-item.active .hero-text{
opacity:1;
transform:translateY(0);
transition-delay:.8s;
}

/* Button */
.hero-btn{
opacity:0;
transform:translateY(60px);
transition:1s;
}
.hero-btn a{
padding:12px 25px;
background:#fff;color:#000;
text-decoration:none;
}
.owl-item.active .hero-btn{
opacity:1;
transform:translateY(0);
transition-delay:1.2s;
}

/* Thumbnail Slider */
.thumb-slider{
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
z-index:20;
}
.thumb-slider img{
width:120px;
margin:10px 0;
border:3px solid #fff;
cursor:pointer;
}

/* Scroll Indicator */
.scroll-down{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
font-size:14px;
opacity:.7;
animation:scrollAnim 2s infinite;
}
@keyframes scrollAnim{
0%{transform:translate(-50%,0)}
50%{transform:translate(-50%,10px)}
100%{transform:translate(-50%,0)}
}
</style>
</head>

<body>

<div class="hero-section">

<div class="hero-slider owl-carousel">

<div class="item">
<div class="hero-bg" style="background-image:url('https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-1.jpg');"></div>
<div class="overlay"><span></span><span></span><span></span><span></span></div>
<div class="hero-content">
<h1 class="hero-title">Ultimate Metalcraft</h1>
<p class="hero-text">High quality engineering solutions</p>
<div class="hero-btn"><a href="#">Discover More</a></div>
</div>
</div>

<div class="item">
<div class="hero-bg" style="background-image:url('https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-2.jpg');"></div>
<div class="overlay"><span></span><span></span><span></span><span></span></div>
<div class="hero-content">
<h1 class="hero-title">Engineering Excellence</h1>
<p class="hero-text">Industrial fabrication services</p>
<div class="hero-btn"><a href="#">Discover More</a></div>
</div>
</div>

<div class="item">
<div class="hero-bg" style="background-image:url('https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-3.jpg');"></div>
<div class="overlay"><span></span><span></span><span></span><span></span></div>
<div class="hero-content">
<h1 class="hero-title">Industrial Solutions</h1>
<p class="hero-text">Reliable & durable products</p>
<div class="hero-btn"><a href="#">Discover More</a></div>
</div>
</div>

</div>

<!-- Thumbnails -->
<div class="thumb-slider">
<img src="https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-1.jpg" onclick="goSlide(0)"><br>
<img src="https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-2.jpg" onclick="goSlide(1)"><br>
<img src="https://nancyispat.omsoftsolution.net.in/wp-content/uploads/2026/04/slider-1-3.jpg" onclick="goSlide(2)">
</div>

<div class="scroll-down">Scroll Down ↓</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/OwlCarousel2/2.3.4/owl.carousel.min.js"></script>

<script>
var owl = $('.hero-slider');
owl.owlCarousel({
loop:true,
items:1,
autoplay:true,
autoplayTimeout:7000,
smartSpeed:1500,
animateOut:'fadeOut'
});

function goSlide(n){
owl.trigger('to.owl.carousel',[n,500]);
}

/* Split text animation */
function splitText(){
document.querySelectorAll('.hero-title').forEach(title=>{
let text = title.innerText;
title.innerHTML="";
text.split("").forEach((letter,i)=>{
let span=document.createElement("span");
span.innerHTML = letter === " " ? "&nbsp;" : letter;
span.style.transitionDelay=(i*0.05)+"s";
title.appendChild(span);
});
});
}
window.onload = splitText;
</script>

</body>
</html>
