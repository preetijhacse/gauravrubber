<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Button Design Example</title>
<style>
    /* Base button styling */
    #btn {
        display: inline-block;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(45deg, #4CAF50, #2E7D32);
        border: none;
        border-radius: 8px;
        cursor: pointer;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }

    /* Hover effect */
    #btn:hover {
        background: linear-gradient(45deg, #66BB6A, #388E3C);
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    /* Active (click) effect */
    #btn:active {
        transform: translateY(0);
        box-shadow: 0 3px 6px rgba(0,0,0,0.2);
    }

    /* Optional: focus outline for accessibility */
    #btn:focus {
        outline: 2px solid #81C784;
        outline-offset: 2px;
    }
    /* Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Header */
.header {
  background: black;
  color: white;
  padding: 15px;
  text-align: center;
}

/* Navbar */
.navbar {
  display: flex;
  justify-content: center;
  background: gray;
}

.navbar a {
  padding: 10px 20px;
  color: white;
  text-decoration: none;
}

/* Layout */
.container {
  display: flex;
}

/* Sidebar */
.sidebar {
  width: 30%;
  background: lightgray;
  padding: 20px;
}

/* Content */
.content {
  width: 70%;
  padding: 20px;
}

/* Footer */
.footer {
  background: black;
  color: white;
  text-align: center;
  padding: 10px;
}

/* 📱 Mobile Responsive */
@media (max-width: 768px) {
  .container {
    flex-direction: column;
  }

  .sidebar, .content {
    width: 100%;
  }

  .navbar {
    flex-direction: column;
    align-items: center;
  }
}
</style>
</head>
<body>
  <header class="header">
    <h1>My Website</h1>
  </header>

  <nav class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <a href="#">Contact</a>
  </nav>

  <div class="container">
    <div class="sidebar">Sidebar</div>
    <div class="content">Main Content</div>
  </div>

  <footer class="footer">
    Footer
  </footer>

<p id="btn">Date and Time</p>
<p id="btn">kamal</p>

<button type="button" onclick="updateTime()">Click Me</button>


</body>
<script>
function updateTime() {
  let elements = document.querySelectorAll('#btn');
  elements.forEach(el => {
    el.innerHTML = Date();
  });
}
</script>
</html>
