<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0c0f12;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .frame {
    position: relative;
    width: 420px;
    height: 420px;
    max-width: 92vw;
    max-height: 92vw;
    overflow: hidden;
    border-radius: 6px;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 20px 60px rgba(0,0,0,0.55);
    background: #05070a;
  }

  .pan-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 220%;
    height: 220%;
    background-image: url('https://ctcweb.omsoftsolution.net.in/wp-content/uploads/2026/08/abt1.webp');
    background-size: cover;
    background-repeat: no-repeat;
    will-change: transform;
    animation: quadrant-tour 22s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  /* Panning window: image is 220% of the frame, so translating by
     roughly -55% shifts a full quadrant into view at a time. */
  @keyframes quadrant-tour {
    0%   { transform: translate(0%, 0%) scale(1); }
    20%  { transform: translate(0%, 0%) scale(1.08); }
    28%  { transform: translate(-52%, 0%) scale(1.08); }
    48%  { transform: translate(-52%, 0%) scale(1.14); }
    56%  { transform: translate(-52%, -52%) scale(1.14); }
    76%  { transform: translate(-52%, -52%) scale(1.08); }
    84%  { transform: translate(0%, -52%) scale(1.08); }
    100% { transform: translate(0%, 0%) scale(1); }
  }

  .vignette {
    position: absolute;
    inset: 0;
    pointer-events: none;
    box-shadow: inset 0 0 60px 20px rgba(0,0,0,0.45);
  }

  .scanline {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(
      to bottom,
      transparent 0%,
      rgba(120, 200, 255, 0.05) 50%,
      transparent 100%
    );
  }

  .label {
    position: absolute;
    left: 14px;
    bottom: 12px;
    color: rgba(255,255,255,0.85);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 6px 1px rgba(74, 222, 128, 0.8);
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .pan-image { animation: none; }
    .dot { animation: none; }
  }
</style>
</head>
<body>

  <div class="frame">
    <div class="pan-image"></div>
    <div class="scanline"></div>
    <div class="vignette"></div>
    <div class="label"><span class="dot"></span>ON SITE</div>
  </div>

</body>
</html>
